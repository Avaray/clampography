name: Sync Dev Branch

# Uruchamia się automatycznie po każdym pushu (lub merge'u) do gałęzi v2
on:
  push:
    branches:
      - v2

jobs:
  sync-branch:
    name: Merge v2 into dev
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wymagane, aby bot mógł wypchnąć zmiany
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Pobiera całą historię dla wszystkich gałęzi
          ref: dev       # Od razu pobiera gałąź dev

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge v2 into dev
        run: |
          # Mergeuje nowości z v2 do aktualnie pobranej gałęzi dev
          git merge origin/v2 --no-edit
          # Wypycha zaktualizowaną gałąź dev na serwer
          git push origin dev

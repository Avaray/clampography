name: Publish to NPM

# Trigger the workflow when code is pushed to main or v2 branches
on:
  push:
    branches:
      - main
      - v2

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if Version Exists
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view clampography@$LOCAL_VERSION version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL_VERSION is new. Proceeding..."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish
    needs: check-version
    # This 'if' condition is what makes GitHub UI show this job as "Skipped" (szary status)
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Provenance attestation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Test Suite
        run: bun test

      - name: Build CSS
        run: bun run build

      - name: Publish to NPM
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version $LOCAL_VERSION..."
          PRERELEASE=""
          if [[ "$LOCAL_VERSION" == *"-"* ]]; then
            PRERELEASE="${LOCAL_VERSION#*-}"
            PRERELEASE="${PRERELEASE%%.*}"
          fi
          if [ -n "$PRERELEASE" ]; then
            echo "Prerelease detected, using --tag $PRERELEASE"
            npm publish --provenance --access public --tag "$PRERELEASE"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish to NPM

# Trigger the workflow when code is pushed to main branch
on:
  push:
    branches:
      - main

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}
    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Node.js (Needed to securely interact with NPM registry)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 3. Early check if version already exists on NPM
      # Compares package.json version with the latest version on NPM.
      # If it exists, sets should_publish=false to skip the next job.
      - name: Check if Version Exists
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view clampography@$LOCAL_VERSION version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL_VERSION is new. Proceeding..."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish
    needs: check-version
    # This 'if' condition is what makes GitHub UI show this job as "Skipped"
    # when the version hasn't changed.
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Provenance attestation
    steps:
      # 1. Checkout the repository code again for this job
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Node.js (Needed for NPM publishing and Provenance)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 3. Setup Bun (Lightning fast package manager)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Install dependencies using Bun
      - name: Install Dependencies
        run: bun install

      # 5. Run tests - if any fail, the release is aborted
      - name: Run Test Suite
        run: bun test

      # 6. Build the CSS files
      - name: Build CSS
        run: bun run build

      # 7. Publish to NPM
      # For prerelease versions (e.g. 2.0.0-beta.1, 2.0.0-rc.0), the tag is
      # automatically extracted from the version string and passed via --tag.
      # Otherwise, it falls back to the default 'latest' tag.
      - name: Publish to NPM
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version $LOCAL_VERSION..."
          # Extract prerelease tag using bash string manipulation (no dependencies needed)
          # e.g. "2.0.0-beta.23" -> "beta", "2.0.0-rc.0" -> "rc", "2.0.0" -> ""
          PRERELEASE=""
          if [[ "$LOCAL_VERSION" == *"-"* ]]; then
            PRERELEASE="${LOCAL_VERSION#*-}"
            PRERELEASE="${PRERELEASE%%.*}"
          fi
          if [ -n "$PRERELEASE" ]; then
            echo "Prerelease detected, using --tag $PRERELEASE"
            npm publish --provenance --access public --tag "$PRERELEASE"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

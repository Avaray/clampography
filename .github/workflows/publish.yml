name: Publish to NPM

# Trigger the workflow when code is pushed to main or v2 branches
on:
  push:
    branches:
      - main
      - v2

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Provenance attestation
    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Bun (Lightning fast package manager)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Setup Node.js (Specifically for stable NPM publishing)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 4. Install dependencies using Bun
      - name: Install Dependencies
        run: bun install

      # 5. Run tests - if any fail, the release is aborted
      - name: Run Test Suite
        run: bun test

      # 6. Build the CSS files
      - name: Build CSS
        run: bun run build

      # 7. Publish to NPM (only if version changed)
      # Compares package.json version with the latest version on NPM.
      # Skips gracefully if the version already exists, instead of failing.
      # For prerelease versions (e.g. 2.0.0-beta.1, 2.0.0-rc.0), the tag is
      # automatically extracted from the version string and passed via --tag.
      - name: Publish to NPM
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view clampography@$LOCAL_VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            echo "Publishing version $LOCAL_VERSION..."
            # Extract prerelease tag using bash string manipulation (no dependencies needed)
            # e.g. "2.0.0-beta.23" -> "beta", "2.0.0-rc.0" -> "rc", "2.0.0" -> ""
            PRERELEASE=""
            if [[ "$LOCAL_VERSION" == *"-"* ]]; then
              PRERELEASE="${LOCAL_VERSION#*-}"   # strip everything up to and including the first "-"
              PRERELEASE="${PRERELEASE%%.*}"     # strip from the first "." onwards
            fi
            if [ -n "$PRERELEASE" ]; then
              echo "Prerelease detected, using --tag $PRERELEASE"
              npm publish --provenance --access public --tag "$PRERELEASE"
            else
              npm publish --provenance --access public
            fi
          else
            echo "Version $LOCAL_VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
